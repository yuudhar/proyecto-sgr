{# Delegaciones adicionales de un usuario: una casilla por delegación, con su color, su código y su nombre. #}
<div class="roles-field delegations-field{% if "is-invalid" in widget.attrs.class %} is-invalid{% endif %}" id="{{ widget.attrs.id }}" role="group" aria-labelledby="{{ widget.attrs.id }}_label" data-label="Delegaciones adicionales" tabindex="-1">
  {% for group, options, index in widget.optgroups %}{% for option in options %}
  <div class="form-check role-option delegation-option">
    <input type="checkbox" name="{{ option.name }}" value="{{ option.value }}" class="form-check-input" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}>
    <label class="form-check-label" for="{{ option.attrs.id }}">
      <span class="delegation-name"><span class="color-swatch" style="--swatch: {{ option.color }}" aria-hidden="true"></span>{{ option.label }}</span>
    </label>
  </div>
  {% endfor %}{% endfor %}
</div>
