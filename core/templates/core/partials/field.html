{# Un campo de formulario: field es un BoundField; ocupa todo el ancho si wide o si crud.full_width lo pide. #}
{% with kind=field.widget_type %}
<div class="{% if kind == 'textarea' or wide or field.name in crud.full_width %}col-12{% else %}col-md-6{% endif %}">
  <label class="form-label" id="{{ field.auto_id }}_label"{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span><span class="visually-hidden"> (obligatorio)</span>{% endif %}</label>
  {{ field }}
  <div class="invalid-feedback{% if field.errors %} d-block{% endif %}" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</div>
  {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
</div>
{% endwith %}
