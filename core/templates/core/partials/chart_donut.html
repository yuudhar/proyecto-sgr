<figure class="chart chart-donut">
  <svg class="donut" viewBox="0 0 42 42" role="img" aria-label="{{ summary }}">
    <circle class="donut-ring" cx="21" cy="21" r="15.9155" fill="none" stroke-width="6"></circle>
    {% for segment in segments %}{% if segment.draw %}
    <circle class="donut-seg donut-{{ segment.tone }}" cx="21" cy="21" r="15.9155" fill="none" stroke-width="6" stroke-dasharray="{{ segment.length }} {{ segment.rest }}" stroke-dashoffset="{{ segment.offset }}" transform="rotate(-90 21 21)"><title>{{ segment.label }}: {{ segment.value }} ({{ segment.percent }} %)</title></circle>
    {% endif %}{% endfor %}
    <text class="donut-total" x="21" y="21.5" text-anchor="middle" dominant-baseline="central" aria-hidden="true">{{ total }}</text>
    <text class="donut-sub" x="21" y="27" text-anchor="middle" aria-hidden="true">{{ center }}</text>
  </svg>
  <figcaption class="chart-caption">
    <span class="chart-title">{{ title }}</span>
    <ul class="chart-legend">
      {% for segment in segments %}<li><span class="swatch donut-{{ segment.tone }}" aria-hidden="true"></span><span class="legend-label">{{ segment.label }}</span><strong>{{ segment.value }}</strong>{% if total %}<span class="muted">({{ segment.percent }} %)</span>{% endif %}</li>{% endfor %}
    </ul>
    {% if not total %}<span class="muted">Sin datos todavía.</span>{% endif %}
  </figcaption>
</figure>
