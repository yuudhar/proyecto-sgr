{% load core_ui %}
<div class="table-responsive">
  <table class="table data-table align-middle mb-0">
    <thead>
      <tr>
        <th scope="col">Código</th>
        <th scope="col">Fecha</th>
        <th scope="col">Tema</th>
        <th scope="col">Solicitud</th>
        <th scope="col">Estado</th>
        <th scope="col" class="num">Gestiones</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td class="nowrap"><a class="cell-link" href="{{ row.url }}">{{ row.code }}</a></td>
        <td class="nowrap">{{ row.date|fdate }}</td>
        <td>{{ row.item|default:"—" }}</td>
        <td>{{ row.request|default:"—"|truncatechars:90 }}</td>
        <td><span class="chip chip-{{ row.tone }}">{{ row.status_label }}</span></td>
        <td class="num">{{ row.followups }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
