# /etc/httpd/conf.d/00-sgr.conf  (fase 1: el sitio por HTTP, antes de tener certificado)
# "__HOST__" lo reemplaza instalar_al2023.sh por la IP pública o el dominio. El nombre 00-sgr.conf hace que Apache lea este
# sitio antes que el de ejemplo de mod_ssl (ssl.conf), así las visitas por IP llegan al SGR y no a la página por defecto.
# phpMyAdmin (/phpMyAdmin, de la AMI LAMP) sigue sirviéndose desde /var/www/html: por eso queda fuera del proxy.

<VirtualHost *:80>
    ServerName __HOST__
    DocumentRoot /var/www/html
    LimitRequestBody 12582912

    # Verificación de Let's Encrypt (certbot --webroot)
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options None
    </Directory>

    # Archivos estáticos (python manage.py collectstatic los deja en staticfiles)
    Alias /static/ /opt/sgr/app/staticfiles/
    <Directory /opt/sgr/app/staticfiles/>
        Require all granted
        Options None
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass /static/ !
    ProxyPass /phpMyAdmin !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
