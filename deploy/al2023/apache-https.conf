<VirtualHost *:80>
    ServerName __HOST__
    DocumentRoot /var/www/html

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options None
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://__HOST__%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName __HOST__
    DocumentRoot /var/www/html
    LimitRequestBody 12582912

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/__HOST__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__HOST__/privkey.pem

    Alias /static/ /opt/sgr/app/staticfiles/
    <Directory /opt/sgr/app/staticfiles/>
        Require all granted
        Options None
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /static/ !
    ProxyPass /phpMyAdmin !
    ProxyPass /ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8000/ws/
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
