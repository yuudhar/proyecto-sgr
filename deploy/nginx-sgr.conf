upstream sgr_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name sgr.example.cl;

    client_max_body_size 12m;  # evidencias de hasta 10 MB

    location /static/ {
        alias /opt/sgr/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # WebSocket (listados y pantallas en vivo): hay que pasar la cabecera Upgrade
    location /ws/ {
        proxy_pass http://sgr_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /salud/ {
        proxy_pass http://sgr_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://sgr_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
