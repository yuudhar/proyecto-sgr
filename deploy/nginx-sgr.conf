# /etc/nginx/conf.d/sgr.conf   (en Ubuntu: /etc/nginx/sites-available/sgr y enlace en sites-enabled)
# Cambia "sgr.example.cl" por el dominio o la IP pública. Para HTTPS usa certbot (ver docs/aws/DESPLIEGUE_AWS.md).
upstream sgr_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name sgr.example.cl;

    client_max_body_size 12m;  # evidencias de hasta 10 MB

    # Archivos estáticos (python manage.py collectstatic los deja en /opt/sgr/app/staticfiles)
    location /static/ {
        alias /opt/sgr/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Revisión de estado para el balanceador o para ti: no pasa por el filtro de ALLOWED_HOSTS de nginx
    location = /salud/ {
        proxy_pass http://sgr_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://sgr_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
